[project]
name = "dfa-simulator"
version = "0.1.0"
description = "Interactive web application for building and simulating Deterministic Finite Automata (DFA)"
readme = "README.md"
authors = [
    { name = "Akshat" }
]
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.scripts]
dfa-simulator = "dfa_simulator:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
